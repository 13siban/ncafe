version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncafe-backend
    ports:
      - "8031:8031"  # 외부 8031 -> 내부 8031
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8031  # [추가] 스프링 내부 포트를 8031로 강제 지정
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    networks:
      - ncafe-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ncafe-frontend
    ports:
      - "3031:3031"
    environment:
      - BACKEND_URL=http://backend:8031
      - PORT=3031
      - HOSTNAME=0.0.0.0
    stdin_open: true # [추가] 컨테이너가 바로 종료되는 것 방지
    tty: true        # [추가] 터미널 환경 활성화
    depends_on:
      - backend
    networks:
      - ncafe-network
    restart: always

networks:
  ncafe-network:
    driver: bridge