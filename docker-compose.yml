name: ${COMPOSE_PROJECT_NAME:-young-ncafe}

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${USER_ID:-young}-ncafe-backend
    container_name: ${USER_ID:-young}-backend
    ports:
      - "${BACKEND_PORT:-8031}:8081"
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=ncafe
      - DB_PASSWORD=1234
      - JWT_SECRET=ncafe-secret-key-for-jwt-signing-and-validation-32chars
    depends_on:
      - db
    restart: unless-stopped

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${USER_ID:-young}-ncafe-frontend
    container_name: ${USER_ID:-young}-frontend
    ports:
      - "${FRONTEND_PORT:-3031}:3001"
    environment:
      - API_BASE_URL=http://backend:8081
      - SESSION_SECRET=${SESSION_SECRET:-ncafe-super-secret-session-key-minimum-32-chars}
      - SESSION_SECURE=true
    depends_on:
      - backend
    restart: unless-stopped

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${USER_ID:-young}-ncafe-db
    profiles: [ "with-db" ]
    container_name: ${USER_ID:-young}-db
    environment:
      POSTGRES_DB: ncafedb
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: 1234
    ports:
      - "${DB_PORT:-5431}:5432"
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ncafe-db-data:
