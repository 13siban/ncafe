name: ${COMPOSE_PROJECT_NAME}

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-backend
    container_name: ${USER_ID}-backend
    # ports:
    #   - "${BACKEND_PORT}:8080"
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    restart: always

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-frontend
    container_name: ${USER_ID}-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - API_BASE_URL=http://backend:8080
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECURE=${SESSION_SECURE}
    depends_on:
      - backend
    restart: always

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-db
    profiles: [ "with-db" ]
    container_name: ${USER_ID}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # 나중에 5432로 바꿀 수도 있으나 지금은 내부 포트를 5431로 고정합니다.
      PGPORT: 5431
    # 외부로 포트를 열지 않고(0.0.0.0 제거) 도커 내부망에서만 사용하도록 expose 처리합니다.
    # ports: 대신 expose를 사용해야 ps 명령 시 '5431/tcp' 로만 깔끔하게 보입니다.
    expose:
      - "5431"
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
    restart: always

volumes:
  ncafe-db-data:


