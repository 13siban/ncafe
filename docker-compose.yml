name: ${COMPOSE_PROJECT_NAME}

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-backend
    container_name: ${USER_ID}-backend
    # ports:
    #   - "${BACKEND_PORT}:8080"
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    restart: unless-stopped

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-frontend
    container_name: ${USER_ID}-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - API_BASE_URL=http://backend:8080
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECURE=${SESSION_SECURE}
    depends_on:
      - backend
    restart: unless-stopped

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-db
    profiles: [ "with-db" ]
    container_name: ${USER_ID}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ncafe-db-data:
