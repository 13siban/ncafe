# =================================================================
# [ 실행 방법 ]
# 1. 기존 컨테이너 삭제: docker compose down
# 2. 빌드 및 실행: docker compose up -d --build
# 3. DB 포함 실행: docker compose --profile with-db up -d --build
# =================================================================

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile  
    container_name: young-ncafe-backend
    ports:
      - "8031:8031"
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=ncafe
      - DB_PASSWORD=1234
    restart: unless-stopped

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: young-ncafe-frontend
    ports:
      - "3031:3031"
    environment:
      - BACKEND_URL=http://young-ncafe-backend:8031
    depends_on:
      - backend
    restart: unless-stopped

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    image: postgres:17
    profiles: [ "with-db" ]
    container_name: ${USER_ID:-ncafe}-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ncafe
      POSTGRES_PASSWORD: 1234
    ports:
      - "5431:5432"
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ncafe-db-data: