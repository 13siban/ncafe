# ncafe Docker Compose - Final Build Configuration
name: ${COMPOSE_PROJECT_NAME}

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-backend
    container_name: ${USER_ID}-backend
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
      # [Named Volume 방식 참고] 도커가 관리하는 볼륨을 사용하려면 아래 주석을 풀고 위 경로를 주석처리하세요.
      # - ncafe_uploads:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/ncafedb
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-frontend
    container_name: ${USER_ID}-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - API_BASE_URL=http://backend:8080
      - CHAT_SERVER_URL=http://agent:8000
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECURE=${SESSION_SECURE}
    depends_on:
      - backend
      - agent
    restart: always

  # ── AI 에이전트 (FastAPI) ──
  agent:
    build:
      context: ./agent-server
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-agent
    container_name: ${USER_ID}-agent
    env_file: ./agent-server/.env
    restart: always

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-db

    container_name: ${USER_ID}-db
    restart: always
    env_file: .env
    environment:
      # DB 컨테이너 내부 포트를 5432로 고정
      - PGPORT=5432
      - POSTGRES_DB=ncafedb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
      # [Named Volume 방식 참고] 도커가 관리하는 볼륨을 사용하려면 아래 주석을 풀고 위 경로를 주석처리하세요.
      # - ncafe_db_data:/var/lib/postgresql/data
    command: -p 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -p 5432 -d ncafedb" ]
      interval: 10s
      timeout: 5s
      retries: 5

# [Named Volume 정의] 위의 서비스 설정에서 Named Volume을 활성화할 경우 아래 주석도 함께 풀어주어야 합니다.
# volumes:
#   ncafe_db_data:
#     name: ${COMPOSE_PROJECT_NAME}-db-data
#   ncafe_uploads:
#     name: ${COMPOSE_PROJECT_NAME}-uploads
