# ncafe Docker Compose - Final Build Configuration
name: ${COMPOSE_PROJECT_NAME}

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-backend
    container_name: ${USER_ID}-backend
    volumes:
      - /home/young/dist/ncafe/upload:/app/upload
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/ncafedb
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    # expose:
    #   - "8080" # [Local Dev Only] Internal port for backend. Managed via Dockerfile EXPOSE.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # ── 프론트엔드 (Next.js) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-frontend
    container_name: ${USER_ID}-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - API_BASE_URL=http://backend:8080
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECURE=${SESSION_SECURE}
    depends_on:
      - backend
    restart: always

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ${USER_ID}-ncafe-db
    profiles: [ "with-db" ]
    container_name: ${USER_ID}-db
    restart: always
    env_file: .env
    environment:
      # DB 컨테이너 내부 포트를 5432로 고정
      - PGPORT=5432
      - POSTGRES_DB=ncafedb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # expose:
    #   - "5432" # [Local Dev Only] Internal port for DB. Managed via Dockerfile EXPOSE.
    volumes:
      - /home/young/dist/ncafe/data:/var/lib/postgresql/data
    command: -p 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -p 5432 -d ncafedb" ]
      interval: 10s
      timeout: 5s
      retries: 5
