spring.application.name=backend
server.port=8031

# DataSource Configuration
# 환경 변수가 없을 경우 로컬(localhost:5435)을 기본값으로 사용합니다.
# 도커 배포 시에는 환경 변수(DB_HOST=db, DB_PORT=5432)를 통해 설정됩니다.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/postgres?useSSL=false
spring.datasource.username=${DB_USERNAME:ncafe}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# 브라우저에서 접근할 url패턴
spring.mvc.static-path-pattern=/**

# 실제 파일이 저장된 경로 , 뒤에 경로 적으면 우선순위가 적용됨
spring.web.resources.static-locations=file:./upload/, classpath:/static/
# spring.web.resources.static-locations=file:/home/young/www/ncafe/backend/upload/, classpath:/static/

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG