# ncafe 로컬 통합 개발 환경 Docker Compose 구성
# 로컬 개발 시 호스트 볼륨 매핑(./data 폴더) 및 포트를 사용하기 위한 오버라이드 파일입니다.

services:
  # ── 백엔드 (Spring Boot) ──
  backend:
    volumes:
      # 로컬 디렉토리(상대경로)에 업로드 파일 저장
      - ./data/upload:/app/upload
    environment:
      # 로컬 개발 환경용 프로필 사용 및 DB 주소 설정
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/ncafedb
    ports:
      # 로컬에서 직접 백엔드 콜 가능하도록 포트 오픈
      - "${LOCAL_BACKEND_PORT:-8080}:8080"

  # ── 프론트엔드 (Next.js) ──
  frontend:
    ports:
      # 프론트엔드 포트 연결
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_BASE_URL=http://backend:8080
      - CHAT_SERVER_URL=http://agent:8000
    depends_on:
      - backend
      - agent

  # ── AI 에이전트 (FastAPI) ──
  agent:
    ports:
      # 로컬에서 에이전트에 직접 접근 가능하도록 포트 오픈
      - "8000:8000"

  # ── 데이터베이스 (PostgreSQL) ──
  db:
    volumes:
      # 로컬 디렉토리(상대경로)에 DB 데이터 유지
      - ./data/db:/var/lib/postgresql/data
    ports:
      # 로컬 DB 클라이언트(DBeaver 등) 접속 가능하도록 포트 오픈
      - "${LOCAL_DB_PORT:-5432}:5432"
