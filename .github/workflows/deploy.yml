name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${{ vars.USER_ID || secrets.USER_ID }}-ncafe" > .env
          echo "USER_ID=${{ vars.USER_ID || secrets.USER_ID }}" >> .env
          echo "BACKEND_PORT=${{ vars.BACKEND_PORT || secrets.BACKEND_PORT }}" >> .env
          echo "FRONTEND_PORT=${{ vars.FRONTEND_PORT || secrets.FRONTEND_PORT }}" >> .env
          echo "DB_PORT=${{ vars.DB_PORT || secrets.DB_PORT }}" >> .env
          echo "SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}" >> .env
          echo "DB_URL=${{ vars.SPRING_DATASOURCE_URL || vars.DB_URL || secrets.DB_URL }}" >> .env
          echo "DB_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME || vars.DB_USERNAME || secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || vars.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET || vars.JWT_SECRET }}" >> .env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}" >> .env
          echo "POSTGRES_DB=${{ vars.POSTGRES_DB || 'ncafedb' }}" >> .env
          echo "SESSION_SECURE=${{ vars.SESSION_SECURE || 'true' }}" >> .env
        env:
          USER_ID: ${{ vars.USER_ID || secrets.USER_ID }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || secrets.FRONTEND_PORT }}

      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3031} || echo "Frontend : not responding"
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
