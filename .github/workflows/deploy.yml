name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create .env file
        run: |
          echo "COMPOSE_PROJECT_NAME=${{ vars.USER_ID }}-ncafe" >> .env
          echo "USER_ID=${{ vars.USER_ID }}" >> .env
          echo "BACKEND_PORT=${{ vars.BACKEND_PORT }}" >> .env
          echo "FRONTEND_PORT=${{ vars.FRONTEND_PORT }}" >> .env
          echo "DB_PORT=${{ vars.DB_PORT }}" >> .env
          echo "BACKEND_IMAGE=${{ vars.BACKEND_IMAGE }}" >> .env
          echo "FRONTEND_IMAGE=${{ vars.FRONTEND_IMAGE }}" >> .env
          echo "SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE }}" >> .env
          echo "JWT_EXPIRATION=${{ vars.JWT_EXPIRATION }}" >> .env
          echo "PROD_DB_URL=${{ vars.SPRING_DATASOURCE_URL }}" >> .env
          echo "PROD_DB_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME }}" >> .env
          echo "PROD_DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
        env:
          USER_ID: ${{ vars.USER_ID }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3031} || echo "Frontend : not responding"
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
