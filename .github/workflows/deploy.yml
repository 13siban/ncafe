name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create .env file
        # 쉘에서 바로 변수를 사용할 수 있게 env 블록 유지
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          echo "COMPOSE_PROJECT_NAME='${{ vars.COMPOSE_PROJECT_NAME }}'" > .env
          echo "USER_ID='${{ vars.USER_ID }}'" >> .env
          echo "BACKEND_PORT='${{ vars.BACKEND_PORT }}'" >> .env
          echo "FRONTEND_PORT='${{ vars.FRONTEND_PORT }}'" >> .env
          echo "DB_PORT='${{ vars.DB_PORT }}'" >> .env
          echo "DB_USERNAME='${{ vars.DB_USERNAME }}'" >> .env
          echo "DB_PASSWORD='$DB_PASSWORD'" >> .env
          echo "JWT_SECRET='$JWT_SECRET'" >> .env
          echo "SESSION_SECRET='$SESSION_SECRET'" >> .env
          echo "DB_URL='jdbc:postgresql://db:5431/ncafedb'" >> .env
          echo "POSTGRES_DB='ncafedb'" >> .env
          echo "SPRING_PROFILES_ACTIVE='prod'" >> .env
          echo "SESSION_SECURE='true'" >> .env


      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3031} || echo "Frontend : not responding"
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
