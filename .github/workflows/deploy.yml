name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Create .env file
        run: |
          cat <<EOF > .env
          COMPOSE_PROJECT_NAME=${{ vars.COMPOSE_PROJECT_NAME || 'young-ncafe' }}
          USER_ID=${{ vars.USER_ID }}
          BACKEND_PORT=${{ vars.BACKEND_PORT || '8031' }}
          FRONTEND_PORT=${{ vars.FRONTEND_PORT || '3031' }}
          DB_PORT=${{ vars.DB_PORT || '5431' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          DB_URL=jdbc:postgresql://db:5431/ncafedb
          POSTGRES_DB=ncafedb
          SPRING_PROFILES_ACTIVE=prod
          SESSION_SECURE=true
          EOF
        env:
          USER_ID: ${{ vars.USER_ID }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Build and Deploy
        run: docker compose --profile with-db up --build -d

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3031} || echo "Frontend : not responding"
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
