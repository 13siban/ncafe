services:
  backend:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./data/upload:/app/upload
    ports:
      - "${LOCAL_BACKEND_PORT:-8080}:8080"

  agent:
    ports:
      - "8000:8000"

  db:
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"

  # 프론트엔드는 도커가 아닌 로컬(npm run dev)에서 실행하는 것을 권장하므로, 
  # 포트 충돌 방지를 위해 도커 프론트엔드 포트는 열지 않거나 다른 번호를 사용합니다.
  frontend:
    ports:
      - "3001:3000"
